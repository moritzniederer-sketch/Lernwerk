<script>/* js/data.js */
/* ===== Lernset-Daten: prüfen, aufbereiten und in die Lern-Engine laden ===== */
const APPCFG={title:"",sub:"",prefix:"lp:none:",exam:""};
let LZ=[],GEN={},INFO={},SECTIONS=[],DATA=null,BEGRIFFE=[];
const R=a=>a[Math.floor(Math.random()*a.length)];
const SH=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const PICK=(a,n)=>SH(a).slice(0,n);
const KEY=a=>a.map(String).sort().join("|");
function mc(id,q,right,wrong,o={}){const opts=SH([...right.map(t=>[t,1]),...wrong.map(t=>[t,0])]);
  return Object.assign({id,type:"mc",q,opts:opts.map(x=>x[0]),ok:opts.map((x,i)=>x[1]?i:-1).filter(i=>i>=0),multi:right.length>1},o)}

/* ---------- Prüfen (die KI kann Fehler machen – alles Unbrauchbare fliegt raus) ---------- */
const S=(x,max=400)=>typeof x==="string"?x.replace(/[\u0000-\u0008\u000B-\u001F]/g,"").trim().slice(0,max):(typeof x==="number"?String(x):"");
const SA=(a,max,min=0,len=200)=>Array.isArray(a)?a.map(x=>S(x,len)).filter(Boolean).slice(0,max):[];
function cleanTask(a){
  if(!a||typeof a!=="object")return null;const type=S(a.type,20),q=S(a.q,600);if(!q)return null;
  const base={type,q,lz:S(a.lz,10),extra:!!a.extra,denk:!!a.denk};const ex=S(a.ex,400);if(ex)base.ex=ex;
  switch(type){
    case "text":{const acc=SA(a.acc,8,1,120);return acc.length?Object.assign(base,{acc}):null}
    case "textn":{const groups=(Array.isArray(a.groups)?a.groups:[]).map(g=>SA(g,10,1,60).map(k=>k.toLowerCase())).filter(g=>g.length).slice(0,10);
      if(!groups.length)return null;const show=SA(a.show,10,0,300);const n=Math.max(1,Math.min(groups.length,parseInt(a.n)||groups.length));
      return Object.assign(base,{kw:true,groups,n,show:show.length?show:groups.map(g=>g[0])})}
    case "mc":{const opts=SA(a.opts,6,2,200);const ok=(Array.isArray(a.ok)?a.ok:[]).map(Number).filter(i=>Number.isInteger(i)&&i>=0&&i<opts.length);
      if(opts.length<2||!ok.length)return null;return Object.assign(base,{opts,ok:[...new Set(ok)],multi:new Set(ok).size>1})}
    case "tf":{if(typeof a.val!=="boolean")return null;return Object.assign(base,{val:a.val})}
    case "match":{const pairs=(Array.isArray(a.pairs)?a.pairs:[]).map(p=>Array.isArray(p)?[S(p[0],120),S(p[1],200)]:null).filter(p=>p&&p[0]&&p[1]).slice(0,6);
      if(pairs.length<3||new Set(pairs.map(p=>p[1])).size<pairs.length)return null;base.id="m-"+KEY(pairs.map(p=>p[0]));return Object.assign(base,{pairs})}
    case "sort":{const cats=SA(a.cats,4,2,60);const items=(Array.isArray(a.items)?a.items:[]).map(p=>Array.isArray(p)?[S(p[0],160),S(p[1],60)]:null).filter(p=>p&&p[0]&&cats.includes(p[1])).slice(0,8);
      if(cats.length<2||items.length<3)return null;base.id="s-"+KEY(items.map(p=>p[0]));return Object.assign(base,{cats,items})}
    case "order":{const items=SA(a.items,7,3,160);if(items.length<3||new Set(items).size<items.length)return null;base.id="o-"+KEY(items);return Object.assign(base,{items})}
    case "cloze":{const parts=(Array.isArray(a.parts)?a.parts:[]).map(p=>typeof p==="string"?S(p,600):(p&&typeof p==="object"?{acc:SA(p.acc,6,1,60),show:S(p.show,60)}:null)).filter(p=>p!==null&&p!=="");
      const gaps=parts.filter(p=>typeof p!=="string");if(!gaps.length||gaps.some(g=>!g.acc.length))return null;gaps.forEach(g=>{if(!g.show)g.show=g.acc[0]});return Object.assign(base,{parts})}
    case "rows":{const rows=(Array.isArray(a.rows)?a.rows:[]).map(r=>Array.isArray(r)?[S(r[0],200),SA(r[1],6,1,80),S(r[2],120)]:null).filter(r=>r&&r[0]&&r[1].length).slice(0,6);
      if(!rows.length)return null;rows.forEach(r=>{if(!r[2])r[2]=r[1][0]});return Object.assign(base,{rows})}
  }
  return null;
}
function cleanSet(d){
  d=d&&typeof d==="object"?d:{};
  const lernziele=(Array.isArray(d.lernziele)?d.lernziele:[]).map((l,i)=>({id:"L"+(i+1),alt:S(l&&l.id,10),titel:S(l&&l.titel,140)||"Lernziel "+(i+1),beschreibung:S(l&&l.beschreibung,240),
    info:SA(l&&l.info,20,0,400),tabelle:(l&&l.tabelle&&Array.isArray(l.tabelle.kopf)&&Array.isArray(l.tabelle.zeilen))?{kopf:SA(l.tabelle.kopf,5,0,80),zeilen:l.tabelle.zeilen.slice(0,15).map(z=>SA(z,5,0,300))}:null})).slice(0,25);
  const idMap={};lernziele.forEach(l=>{if(l.alt)idMap[l.alt]=l.id;idMap[l.id]=idMap[l.id]||l.id});
  const aufgaben=(Array.isArray(d.aufgaben)?d.aufgaben:[]).map(cleanTask).filter(Boolean).map(t=>{t.lz=idMap[t.lz]||(lernziele[0]&&lernziele[0].id)||"L1";return t}).slice(0,600);
  const begriffe=(Array.isArray(d.begriffe)?d.begriffe:[]).map(b=>({begriff:S(b&&b.begriff,80),erklaerung:S(b&&b.erklaerung,400),stichwoerter:(Array.isArray(b&&b.stichwoerter)?b.stichwoerter:[]).map(g=>SA(g,8,1,50).map(k=>k.toLowerCase())).filter(g=>g.length).slice(0,4)}))
    .filter(b=>b.begriff&&b.erklaerung).slice(0,80);
  const ereignisse=(Array.isArray(d.ereignisse)?d.ereignisse:[]).map(e=>({jahr:Number(e&&e.jahr),text:S(e&&e.text,160)})).filter(e=>Number.isFinite(e.jahr)&&e.text).slice(0,60);
  const raetsel=(Array.isArray(d.raetsel)?d.raetsel:[]).map(r=>({loesung:S(r&&r.loesung,60),alternativen:SA(r&&r.alternativen,5,0,60),hinweise:SA(r&&r.hinweise,3,0,240)})).filter(r=>r.loesung&&r.hinweise.length===3).slice(0,40);
  return {titel:S(d.titel,140),lernziele,aufgaben,begriffe,ereignisse,raetsel,quelle:S(d.quelle,20)||"ki"};
}

/* ---------- In die Engine laden ---------- */
function begriffTasks(){const core=[],extra=[];
  BEGRIFFE.forEach((b,i)=>{const groups=b.stichwoerter.length?b.stichwoerter:[[norm(b.erklaerung).split(" ").filter(w=>w.length>5)[0]||norm(b.begriff)]];
    core.push({type:"textn",kw:true,n:groups.length,q:"Erkläre den Begriff «"+b.begriff+"».",groups,show:[b.erklaerung]});
    extra.push({type:"text",q:"Welcher Begriff ist gemeint? «"+b.erklaerung+"»",acc:[b.begriff]})});
  const sh=SH(BEGRIFFE);for(let k=0;k+3<=sh.length&&k<16;k+=4){const pr=sh.slice(k,k+4);if(pr.length>=3)extra.push({id:"bm-"+KEY(pr.map(b=>b.begriff)),type:"match",q:"Welche Erklärung passt zum Begriff?",pairs:pr.map(b=>[b.begriff,b.erklaerung.length>110?b.erklaerung.slice(0,107)+"…":b.erklaerung])})}
  return {core,extra}}
function applyData(raw){
  DATA=cleanSet(raw);BEGRIFFE=DATA.begriffe;
  LZ=DATA.lernziele.map(l=>({id:l.id,t:l.titel,d:l.beschreibung}));INFO={};GEN={};
  DATA.lernziele.forEach(l=>{INFO[l.id]={f:l.info.length?l.info:["(Keine Infos – übe direkt mit den Aufgaben.)"],table:l.tabelle&&l.tabelle.kopf.length?{head:l.tabelle.kopf,rows:l.tabelle.zeilen}:null};
    const mine=DATA.aufgaben.filter(a=>a.lz===l.id);
    GEN[l.id]=()=>{const c=mine.map(t=>JSON.parse(JSON.stringify(t)));return {core:c.filter(t=>!t.extra),extra:c.filter(t=>t.extra)}}});
  if(BEGRIFFE.length>=2){LZ.unshift({id:"L0",t:"Wichtige Begriffe",d:BEGRIFFE.length+" Begriffe erklären können"});INFO.L0={f:BEGRIFFE.map(b=>b.begriff+": "+b.erklaerung)};GEN.L0=begriffTasks}
  LZ=LZ.filter(l=>{const b=GEN[l.id]();return b.core.length+b.extra.length>0});
  LZ.forEach(l=>{const b=GEN[l.id]();if(!b.core.length&&b.extra.length){const g=GEN[l.id];GEN[l.id]=()=>{const x=g();return {core:x.extra,extra:[]}}}});
  SECTIONS=[["Lernziele",LZ.map(l=>l.id)]];
}

/* ---------- Automatische Probeprüfung aus dem Lernset ---------- */
const PTS_OF=t=>t.type==="textn"?Math.min(3,Math.max(1,t.n)):["match","sort","order","cloze","rows"].includes(t.type)?2:t.denk?2:1;
function autoExam(){
  const A=[];const AB=i=>String.fromCharCode(97+i)+") ";
  if(BEGRIFFE.length>=4){const nb=Math.min(6,4+Math.floor(Math.random()*3));
    A.push({t:"Begriffe",parts:PICK(BEGRIFFE,nb).map((b,i)=>{const groups=b.stichwoerter.length?b.stichwoerter:[[norm(b.begriff)]];return {q:AB(i)+"Erkläre den Begriff «"+b.begriff+"».",pts:1,t:{type:"textn",kw:true,n:groups.length,groups,show:[b.erklaerung]}}})})}
  const lzs=LZ.filter(l=>l.id!=="L0");const pool=SH(lzs).slice(0,Math.min(7,lzs.length));
  pool.forEach(l=>{const b=GEN[l.id]();const c=SH(b.core.filter(t=>!t.denk)).slice(0,2);if(!c.length)return;
    A.push({t:l.t,parts:c.map((t,i)=>({q:(c.length>1?AB(i):"")+t.q,pts:PTS_OF(t),t}))})});
  const denk=SH(lzs.flatMap(l=>GEN[l.id]().core.concat(GEN[l.id]().extra).filter(t=>t.denk))).slice(0,2);
  if(denk.length)A.push({t:"Denkaufgaben",parts:denk.map((t,i)=>({q:(denk.length>1?AB(i):"")+t.q,pts:3,t}))});
  return {kind:"Probeprüfung",A};
}

</script>
<script>/* js/engine/ui.js */
/* ===== Trainer ===== */
const app=document.getElementById("app");
function h(t,a,...k){const e=document.createElement(t);if(a)for(const[x,v]of Object.entries(a)){if(v==null||v===false)continue;if(x==="class")e.className=v;else if(x.startsWith("on"))e.addEventListener(x.slice(2),v);else e.setAttribute(x,v===true?"":v)}for(const c of k.flat(Infinity)){if(c==null||c===false)continue;e.append(c instanceof Node?c:String(c))}return e}
const APP=(typeof APPCFG!=="undefined")?APPCFG:{title:"",sub:"",prefix:"lp:"};
function load(k,d){try{return JSON.parse(localStorage.getItem(APP.prefix+k))??d}catch(e){return d}}
function save(k,v){try{localStorage.setItem(APP.prefix+k,JSON.stringify(v))}catch(e){}}
let seen=load("seen",{});      // id -> wie oft gesehen (Üben)
let tseen=load("tseen",{});    // id -> wie oft im Test
let ok=load("ok",{});          // id -> zuletzt richtig?
let lzStat=load("lz",{});      // Lernziel -> {r,n}
let tests=load("tests",[]);
function view(...k){app.replaceChildren(...k.flat(Infinity).filter(Boolean));window.scrollTo(0,0)}

/* ---------- Aufgabenpools ---------- */
function bank(id){const b=GEN[id]();b.core.forEach(t=>t.lz=id);b.extra.forEach(t=>t.lz=id);return b}
/* Inhalt einer Aufgabe: gleiche Frage = gleiche Aufgabe, auch wenn sie neu erzeugt wurde */
const ck=t=>["sort","match","label","plabel"].includes(t.type)?t.id:t.type+"|"+t.q+(t.img?"|"+t.img:"")+(t.leg?"|"+t.leg:"")+(t.foto?"|"+t.foto:"")+(t.quelle?"|"+t.quelle:"")+(t.uid?"|"+t.uid:"");
let ts=load("ts",{});
function weight(t,counter){const k=ck(t);const age=(Date.now()-(ts[k]||0))/60000;return (counter[k]||0)*10+(age<45?25:age<240?8:0)+Math.random()*9}
function freshPick(list,n,counter){
  /* zuerst nie gesehene, dann am seltensten und am längsten nicht mehr gesehene; jeden Inhalt nur einmal */
  const by={};list.forEach(t=>{const k=ck(t);if(!by[k])by[k]=t});
  return Object.values(by).map(t=>[t,weight(t,counter)]).sort((a,b)=>a[1]-b[1]).slice(0,n).map(x=>x[0]);
}
function mark(t,s){const k=ck(t);seen[k]=(seen[k]||0)+1;ts[k]=Date.now();ok[k]=s>=1}

/* ---------- Antworten prüfen ---------- */
const norm=s=>String(s).toLowerCase().replace(/ä/g,"ae").replace(/ö/g,"oe").replace(/ü/g,"ue").replace(/ß/g,"ss").normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/[^a-z0-9 ]+/g," ").replace(/\b(der|die|das|den|dem|ein|eine|einer|eines)\b/g," ").replace(/\s+/g," ").trim();
function lev(a,b){const m=a.length,n=b.length;if(!m)return n;if(!n)return m;let p=Array.from({length:n+1},(_,j)=>j);for(let i=1;i<=m;i++){const c=[i];for(let j=1;j<=n;j++)c[j]=Math.min(p[j]+1,c[j-1]+1,p[j-1]+(a[i-1]===b[j-1]?0:1));p=c}return p[n]}
function same(inp,cand){const x=norm(inp),c=norm(cand);if(!x||!c)return false;if(x===c||x.replace(/ /g,"")===c.replace(/ /g,""))return true;const tol=c.length>=10?2:c.length>=5?1:0;if(lev(x,c)<=tol)return true;
  const xw=x.split(" ");if(c.length>=5&&xw.length<=c.split(" ").length+3&&(" "+x+" ").includes(" "+c+" "))return true;return false}
const parts=s=>String(s).split(/,|;|\/|\bund\b|\n/).map(x=>x.trim()).filter(Boolean);

/* ---------- Aufgabentypen: bauen, Antwort holen, bewerten, zeigen ---------- */
const TYPELAB={plabel:"Skelett beschriften",foto:"Foto erkennen",zelle:"Zellschicht und Aufgabe",stamm:"Merkmale und Tiere",label:"Beschriften",text:"Eintippen",textn:"Eintippen",mc:"Auswählen",tf:"Stimmt das?",match:"Zuordnen",sort:"Sortieren",order:"Reihenfolge"};
function build(t,mount){
  const box=h("div");
  if(t.type==="text"||t.type==="textn"){
    const inp=t.kw?h("textarea",{rows:"4",spellcheck:"false","aria-label":"Antwort",placeholder:"Ein Merkmal pro Zeile oder mit Komma getrennt"}):h("input",{type:"text",autocomplete:"off",spellcheck:"false","aria-label":"Antwort",placeholder:t.type==="textn"?"Antworten mit Komma trennen":""});
    if(t.quelle&&typeof QUELLEN!=="undefined"){const Q=QUELLEN.find(q=>q.id===t.quelle);if(Q)box.append(quelleNode(Q)())}
    if(t.img||t.leg){const w=document.createElement("div");w.className="tierbox";w.innerHTML=t.img?tierSVG(t.img):beinSVG(t.leg);box.append(w)}
    box.append(inp);mount.append(box);
    return{focus:()=>inp.focus(),get:()=>inp.value,lock(){inp.disabled=true},mark(g){inp.classList.add(g.s>=1?"okf":g.s>0?"warnf":"badf")}};
  }
  if(t.type==="mc"||t.type==="tf"){
    const opts=t.type==="tf"?["Stimmt","Stimmt nicht"]:t.opts;const sel=new Set();
    const bs=opts.map((o,i)=>h("button",{class:"opt","aria-pressed":"false",onclick:()=>{if(t.type==="tf"||!t.multi){sel.clear();bs.forEach(b=>b.setAttribute("aria-pressed","false"))}
      if(sel.has(i)){sel.delete(i);bs[i].setAttribute("aria-pressed","false")}else{sel.add(i);bs[i].setAttribute("aria-pressed","true")}}},o));
    box.append(t.multi?h("p",{class:"small muted",style:"margin:0 0 8px"},"Mehrere Antworten können richtig sein."):null,h("div",{class:"opts"},bs));mount.append(box);
    return{focus:()=>{},get:()=>[...sel],lock(){bs.forEach(b=>b.disabled=true)},mark(){const right=t.type==="tf"?[t.val?0:1]:t.ok;bs.forEach((b,i)=>{if(right.includes(i))b.classList.add("right");else if(sel.has(i))b.classList.add("wrong")})}};
  }
  if(t.type==="match"||t.type==="sort"){
    const rows=t.type==="match"?t.pairs.map(p=>[p[0],p[1]]):t.items;
    const choices=t.type==="match"?SH([...new Set(t.pairs.map(p=>p[1]))]):t.cats;

function lzRound(id,onlyNew){
  const b=bank(id);

    /* noch nicht gekonnte Grundaufgaben + neue Zusatzaufgaben, auffüllen mit am längsten nicht gesehenen */
    const open=b.core.filter(t=>!ok[ck(t)]);
    const extra=freshPick(b.extra,Math.min(8,b.extra.length),seen);

    if(tasks.length<10)tasks=tasks.concat(freshPick(b.core.filter(t=>!open.includes(t)),10-tasks.length,seen));
    tasks=SH(tasks);
  }else{
    /* alle Grundaufgaben + die am wenigsten gesehenen Zusatzaufgaben */

    tasks=SH(b.core).concat(SH(extra));
  }

function mixRound(){

  const rest=all.flatMap(b=>b.core.concat(b.extra)).filter(t=>!tasks.some(x=>x.id===t.id));
  const weakScore=t=>{const s=lzStat[t.lz];return s&&s.n?1-s.r/s.n:0.5};
  const ranked=rest.map(t=>[t,weight(t,seen)-weakScore(t)*6]).sort((a,b)=>a[1]-b[1]).map(x=>x[0]);
  const ids=new Set(tasks.map(ck));for(const t of ranked){if(tasks.length>=16)break;if(!ids.has(ck(t))){ids.add(ck(t));tasks.push(t)}}
  practice("Gemischte Übung",SH(tasks),mixRound);
}

/* ---------- Zeitreise: Was war früher? ---------- */
const jahr=y=>y<0?(-y)+" v. Chr.":y+" n. Chr.";

/* ---------- Memory ---------- */
function memory(){document.onkeydown=null;G.on=false;const src=PICK(BEGRIFFE.map(b=>[b.begriff,b.erklaerung]),6);
  const short=d=>{d=d.split(/[.:–]/)[0];return d.length>70?d.slice(0,67)+"…":d};
  const cards=SH(src.flatMap((b,i)=>[{p:i,t:b[0],k:"t"},{p:i,t:short(b[1]),k:"d"}]));let open=[],found=0,moves=0,lock=false;const t0=Date.now();
  const info=h("p",{class:"small muted"},"Züge: 0 · Paare: 0 / 6");
  const els=cards.map((c,i)=>{const e=h("button",{class:"mcard "+c.k,onclick:()=>flip(i)},h("span",{class:"mback"},"❓"),h("span",{class:"mfront"},c.t));return e});
  function flip(i){if(lock||els[i].classList.contains("up"))return;els[i].classList.add("up");open.push(i);
    if(open.length===2){moves++;const [x,y]=open;open=[];
      if(cards[x].p===cards[y].p&&cards[x].k!==cards[y].k){found++;[x,y].forEach(j=>els[j].classList.add("done"));pop("Paar gefunden!","ok");if(found===6)setTimeout(fin,600)}

    endScreen(rec?"🏆":"🃏",rec?"Neuer Rekord!":"Alle Paare gefunden!",moves+" Züge",[{t:Math.round((Date.now()-t0)/1000)+" Sekunden · +"+xp+" XP"},{t:"Je weniger Züge, desto mehr XP.",c:"muted"}],memory)}
  view(h("div",{class:"head"},h("h2",null,"🃏 Memory"),h("button",{class:"ghost",onclick:home},"Beenden")),h("p",{class:"small"},"Finde zu jedem Begriff die passende Erklärung."),info,h("div",{class:"mgrid"},els))}
/* ---------- Wort-Rätsel (Galgenmännchen) ---------- */
function galgenWords(){const L=BEGRIFFE.map(b=>[b.begriff.replace(/\s*\(.*\)/,""),b.erklaerung]);
  return L.filter(w=>/^[A-Za-zÄÖÜäöüß .-]+$/.test(w[0])&&w[0].length>=4&&w[0].length<=20)}
function galgen(){document.onkeydown=null;G.on=false;const W=PICK(galgenWords(),5);let k=0,score=0,solved=0;
  function round(){if(k>=W.length)return fin();const [word,hint]=W[k];const up=word.toUpperCase();const got=new Set([" ","-","."]);let lives=7,done=false;
    const disp=h("div",{class:"gword"}),hearts=h("div",{class:"hearts"}),fb=h("div");const keys={};
    const letters="ABCDEFGHIJKLMNOPQRSTUVWXYZÄÖÜ".split("");

    const paint=()=>{disp.replaceChildren(...[...up].map(c=>h("span",{class:"gl"+(c===" "?" sp":"")},got.has(c)?c:"")));hearts.textContent="🛡️".repeat(lives)+"▫️".repeat(7-lives)};
    function guess(L){if(done||got.has(L))return;got.add(L);keys[L].disabled=true;
      if(up.includes(L)){keys[L].classList.add("kok")}else{keys[L].classList.add("kbad");lives--}
      paint();const win=[...up].every(c=>got.has(c));
      if(win||lives<=0){done=true;Object.values(keys).forEach(b=>b.disabled=true);
        if(win){const p=10+lives*3;score+=p;solved++;pop("+"+p,"ok");if(lives>=6)confetti(70)}else{[...up].forEach(c=>got.add(c));paint()}
        fb.replaceChildren(h("div",{class:"fb "+(win?"ok":"bad")},h("strong",null,win?R(PRAISE.ok)+" ":"Leider verloren … "),"Lösung: ",h("b",null,word)),h("button",{class:"primary",style:"margin-top:10px",onclick:()=>{document.onkeydown=null;k++;round()}},k<W.length-1?"Nächstes Wort":"Ergebnis"))}}
    document.onkeydown=e=>{const L=e.key.toUpperCase();if(!done&&letters.includes(L))guess(L);else if(done&&e.key==="Enter")fb.querySelector("button.primary")?.click()};
    view(h("div",{class:"head"},h("h2",null,"🔤 Wort-Rätsel"),h("button",{class:"ghost",onclick:()=>{document.onkeydown=null;home()}},"Beenden")),h("p",{class:"small muted"},"Wort "+(k+1)+" von "+W.length+" · "+score+" Punkte"),
      h("div",{class:"panel gamebox"},h("p",{class:"small"},h("b",null,"Hinweis: "),hint),hearts,disp,kb,fb));paint()}
  function fin(){const rec=setBest("gal",score);addXP(Math.round(score/6));if(solved>=4)confetti(150);
    endScreen(rec?"🏆":"🔤",rec?"Neuer Rekord!":"Geschafft!",score+" Punkte",[{t:solved+" von "+W.length+" Wörtern erraten · +"+Math.round(score/6)+" XP"}],galgen)}

<script>/* js/api.js */
/* ===== Verbindung zum Server (Supabase) – oder Demo-Modus, wenn noch nichts eingerichtet ist ===== */
const CFG=window.LP_CONFIG||{};
const DEMO=!CFG.SUPABASE_URL||!CFG.SUPABASE_ANON_KEY||typeof supabase==="undefined";
const MAX_TEXT=CFG.MAX_TEXT_CHARS||40000;

/* Kleine Hilfen */
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
async function sha256(t){const b=await crypto.subtle.digest("SHA-256",new TextEncoder().encode(t));return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,"0")).join("")}
const ls={get(k,d){try{return JSON.parse(localStorage.getItem(k))??d}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}},del(k){try{localStorage.removeItem(k)}catch(e){}}};
const uid=()=>(crypto.randomUUID?crypto.randomUUID():Date.now().toString(36)+Math.random().toString(36).slice(2));
class ApiError extends Error{constructor(msg,code){super(msg);this.code=code}}

/* ---------- Supabase ---------- */
function supabaseApi(){
  const sb=supabase.createClient(CFG.SUPABASE_URL,CFG.SUPABASE_ANON_KEY);
  const must=({data,error})=>{if(error)throw new ApiError(deMsg(error.message),error.code);return data};
  const me=async()=>{const {data}=await sb.auth.getUser();if(!data.user)throw new ApiError("Du bist nicht angemeldet.","auth");return data.user};
  return {
    mode:"server",
    async session(){const {data}=await sb.auth.getSession();return data.session?{id:data.session.user.id,email:data.session.user.email}:null},
    onAuth(fn){sb.auth.onAuthStateChange((ev)=>fn(ev))},
    async signUp(email,pw,name){const r=await sb.auth.signUp({email,password:pw,options:{data:{display_name:name},emailRedirectTo:location.origin+location.pathname}});must(r);return {needsConfirm:!r.data.session}},
    async signIn(email,pw){must(await sb.auth.signInWithPassword({email,password:pw}))},
    async signOut(){await sb.auth.signOut()},
    async resetPassword(email){must(await sb.auth.resetPasswordForEmail(email,{redirectTo:location.origin+location.pathname+"#neues-passwort"}))},
    async updatePassword(pw){must(await sb.auth.updateUser({password:pw}))},
    async getProfile(){const u=await me();const d=must(await sb.from("profiles").select("display_name,settings,game").eq("id",u.id).maybeSingle());return d||{display_name:"",settings:{},game:{}}},
    async saveProfile(p){const u=await me();must(await sb.from("profiles").update(p).eq("id",u.id))},
    async listSummaries(){return must(await sb.from("summaries").select("id,title,status,created_at,progress_pc").order("created_at",{ascending:false}))},
    async getSummary(id){return must(await sb.from("summaries").select("id,title,source_text,data,progress,status").eq("id",id).single())},
    async createSummary(title,text){const u=await me();return must(await sb.from("summaries").insert({user_id:u.id,title,source_text:text,status:"wird erstellt"}).select("id").single()).id},
    async updateSummary(id,p){must(await sb.from("summaries").update(p).eq("id",id))},
    async deleteSummary(id){must(await sb.from("summaries").delete().eq("id",id))},
    async callGenerate(body){const {data,error}=await sb.functions.invoke("generate",{body});
      if(error){let msg="Der Server konnte das Lernset nicht erstellen.";try{const j=await error.context.json();if(j&&j.error)msg=j.error}catch(e){}throw new ApiError(msg,"gen")}
      if(data&&data.error)throw new ApiError(data.error,"gen");return data},
    async deleteAccount(){const {data,error}=await sb.functions.invoke("konto-loeschen",{body:{}});if(error||(data&&data.error))throw new ApiError("Das Konto konnte nicht gelöscht werden. Versuche es später nochmals.","del");await sb.auth.signOut()}
  };
}
function deMsg(m){m=String(m||"");
  if(/Invalid login credentials/i.test(m))return "E-Mail oder Passwort ist falsch.";
  if(/Email not confirmed/i.test(m))return "Bitte bestätige zuerst deine E-Mail-Adresse (Link im Mail).";
  if(/already registered|already exists/i.test(m))return "Mit dieser E-Mail-Adresse gibt es schon ein Konto.";
  if(/Password should be/i.test(m))return "Das Passwort ist zu kurz (mindestens 8 Zeichen).";
  if(/rate limit/i.test(m))return "Zu viele Versuche. Warte kurz und versuche es nochmals.";
  if(/fetch|network/i.test(m))return "Keine Verbindung zum Server. Prüfe dein Internet.";
  return m}

/* ---------- Demo-Modus (alles nur in diesem Browser, ohne KI) ---------- */
function demoApi(){
  const U="lpdemo:users",SES="lpdemo:session";
  const cur=()=>{const id=ls.get(SES,null);if(!id)throw new ApiError("Du bist nicht angemeldet.","auth");return id};
  const sumKey=()=>"lpdemo:summaries:"+cur();
  let authFn=()=>{};
  return {
    mode:"demo",
    async session(){const id=ls.get(SES,null);if(!id)return null;const u=Object.values(ls.get(U,{})).find(x=>x.id===id);return u?{id,email:u.email}:null},
    onAuth(fn){authFn=fn},
    async signUp(email,pw,name){const us=ls.get(U,{});const k=email.toLowerCase();if(us[k])throw new ApiError("Mit dieser E-Mail-Adresse gibt es schon ein Konto.");
      const id=uid();us[k]={id,email:k,pw:await sha256(k+":"+pw)};ls.set(U,us);ls.set("lpdemo:profile:"+id,{display_name:name,settings:{},game:{}});ls.set(SES,id);return {needsConfirm:false}},
    async signIn(email,pw){const u=ls.get(U,{})[email.toLowerCase()];if(!u||u.pw!==await sha256(email.toLowerCase()+":"+pw))throw new ApiError("E-Mail oder Passwort ist falsch.");ls.set(SES,u.id)},
    async signOut(){ls.del(SES)},
    async resetPassword(){throw new ApiError("Im Demo-Modus gibt es keine E-Mails. Erstelle einfach ein neues Konto.")},
    async updatePassword(pw){const id=cur();const us=ls.get(U,{});const k=Object.keys(us).find(k=>us[k].id===id);us[k].pw=await sha256(k+":"+pw);ls.set(U,us)},
    async getProfile(){return ls.get("lpdemo:profile:"+cur(),{display_name:"",settings:{},game:{}})},
    async saveProfile(p){const k="lpdemo:profile:"+cur();ls.set(k,Object.assign(ls.get(k,{}),p))},
    async listSummaries(){return ls.get(sumKey(),[]).map(s=>({id:s.id,title:s.title,status:s.status,created_at:s.created_at,progress_pc:s.progress_pc||0}))},
    async getSummary(id){const s=ls.get(sumKey(),[]).find(x=>x.id===id);if(!s)throw new ApiError("Nicht gefunden.");return s},
    async createSummary(title,text){const l=ls.get(sumKey(),[]);const id=uid();l.unshift({id,title,source_text:text,data:null,progress:{},status:"wird erstellt",created_at:new Date().toISOString()});ls.set(sumKey(),l);return id},
    async updateSummary(id,p){const l=ls.get(sumKey(),[]);const s=l.find(x=>x.id===id);if(s)Object.assign(s,p);ls.set(sumKey(),l)},
    async deleteSummary(id){ls.set(sumKey(),ls.get(sumKey(),[]).filter(x=>x.id!==id))},
    async callGenerate(){throw new ApiError("Im Demo-Modus gibt es keine KI.","demo")},
    async deleteAccount(){const id=cur();const us=ls.get(U,{});Object.keys(us).forEach(k=>{if(us[k].id===id)delete us[k]});ls.set(U,us);ls.del("lpdemo:profile:"+id);ls.del("lpdemo:summaries:"+id);ls.del(SES)}
  };
}
const API=DEMO?demoApi():supabaseApi();

/* ---------- Lernset erstellen: KI in mehreren kurzen Schritten (sonst einfacher Generator) ---------- */
async function generateSet(id,title,text,settings,onStep){
  if(API.mode==="demo"||CFG.KI===false){onStep("Ich lese deine Zusammenfassung …",.3);await sleep(500);onStep("Ich erstelle die Aufgaben …",.7);await sleep(400);return heuristicSet(title,text)}
  onStep("Ich lese deine Zusammenfassung und finde die Lernziele …",.08);
  const plan=await API.callGenerate({summary_id:id,step:"plan",niveau:settings.niveau});
  const lz=(plan.lernziele||[]).map((l,i)=>Object.assign({},l,{id:"L"+(i+1)}));
  if(!lz.length)throw new ApiError("In dieser Zusammenfassung habe ich keine Lernziele gefunden.");
  const chunks=[];for(let i=0;i<lz.length;i+=2)chunks.push(lz.slice(i,i+2));
  let aufgaben=[];
  for(let k=0;k<chunks.length;k++){onStep("Ich erstelle Aufgaben zu «"+chunks[k].map(l=>l.titel).join("», «")+"» …",.15+.8*k/chunks.length);
    let r=null;for(let tr=0;tr<2&&!r;tr++){try{r=await API.callGenerate({summary_id:id,step:"aufgaben",niveau:settings.niveau,lernziele:chunks[k].map(l=>({id:l.id,titel:l.titel,beschreibung:l.beschreibung}))})}catch(e){if(tr===1)throw e;await sleep(1500)}}
    aufgaben=aufgaben.concat(r.aufgaben||[])}
  onStep("Fertig! Ich prüfe noch alles …",.98);
  return {titel:plan.titel||title,lernziele:lz,aufgaben,begriffe:plan.begriffe||[],ereignisse:plan.ereignisse||[],raetsel:plan.raetsel||[],quelle:"ki"};
}

</script>
